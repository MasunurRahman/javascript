<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of Shapes</title>
</head>
<body>
    
    <script>

      //rectangle area
      var base = parseFloat(prompt("Enter Base : "));
      var height = parseFloat(prompt("Enter Height : "));
      //var area = base * height;//rectangle
      var area = (base * height) / 2;//triangle
      document.write(area);
    </script>
</body>
</html>
