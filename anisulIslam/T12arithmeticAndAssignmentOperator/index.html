<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic and Assignment Operator</title>
</head>
<body>
    
    <script>

      // Arithmetic Operator + - * / %(modulas) **(Exponent) ++(increment) --(Decrement)
     //Assignment Operator = += -= *= /= %=
      var x = 4;
      x = x**2;
      x += 4;
      document.write(x);
    </script>
</body>
</html>
