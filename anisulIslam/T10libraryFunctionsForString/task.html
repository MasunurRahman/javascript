<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task</title>
</head>
<body>
    
    <script>

        var firstName = prompt("Enter your First Name : ");
        var lastName = prompt("Enter your Last Name : ");
        var fullName = firstName + " " + lastName;
        document.write("Your name is : " + fullName);
        document.write("<br>Total length of full name is : ", + fullName.length);
        document.write("<br> your name in Upper Case : " + fullName.toUpperCase());
        document.write("<br>2nd position of your name is : " + fullName.charAt(1));

    </script>
</body>
</html>
